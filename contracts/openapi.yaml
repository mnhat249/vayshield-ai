# SINH TỰ ĐỘNG bởi `uv run python -m app.core.contract_export` — KHÓA ở mốc M0.
# Đổi contract = task riêng có người duyệt (CLAUDE.md §5).
openapi: 3.1.0
info:
  title: VayShield AI API
  description: 'VayShield AI — bảo vệ người đi vay khỏi app vay lừa đảo, lãi cắt cổ, chiếm đoạt OTP. Lỗi
    luôn là JSON {error:{code,message_vi,trace_id}}. Tiền tệ: số nguyên VND. SSE: contracts/sse-events.schema.json.
    WebSocket: contracts/ws-protocol.json.'
  version: 1.0.0
paths:
  /api/v1/devices/register:
    post:
      tags:
      - edge-policy
      summary: Đăng ký thiết bị ẩn danh + khóa ECDSA (Public + PoW / RateLimit, < 80ms)
      operationId: devicesRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
        '400':
          description: Yêu cầu hỏng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Vượt giới hạn tần suất / ngân sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi nội bộ (JSON, không bao giờ HTML — EC-OPS23)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/devices/me:
    delete:
      tags:
      - edge-policy
      summary: Xóa toàn bộ dữ liệu & hủy liên kết người thân (Luật 91/2025, EC-DB21)
      operationId: devicesDeleteMe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWipeResponse'
        '401':
          description: Thiếu/sai xác thực
