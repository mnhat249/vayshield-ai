          - type: 'null'
        lookalike_of:
          anyOf:
          - type: string
          - type: 'null'
          title: Lookalike Of
          description: Tên thương hiệu bị nhái
        dangerous_permissions:
          items:
            type: string
          type: array
          title: Dangerous Permissions
        reasons_vi:
          items:
            type: string
          type: array
          title: Reasons Vi
        recommend_contract_scan:
          type: boolean
          title: Recommend Contract Scan
      type: object
      required:
      - audit_id
      - apk_verdict
      - severity
      - recommend_contract_scan
      title: ApkVerifyResponse
