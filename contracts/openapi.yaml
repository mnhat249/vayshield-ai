components:
  schemas:
    AmountBucketTier:
      type: string
      enum:
      - TIER_UNDER_3M
      - TIER_3M_10M
      - TIER_10M_30M
      - TIER_30M_100M
      - TIER_OVER_100M
      title: AmountBucketTier
      description: 'Khoảng số tiền (không lưu số lẻ — Zero-PII). File 4 chỉ nêu TIER_10M_30M; các bậc
        khác

        là giả định T00.'
    AndroidPackageSig:
      properties:
        pkg:
          type: string
          title: Pkg
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
          description: SHA-256 chứng chỉ ký APK (hex)
      type: object
      required:
      - pkg
      title: AndroidPackageSig
    ApkVerdict:
      type: string
      enum:
      - OFFICIAL_LICENSED
      - LOOKALIKE_SPOOF
      - UNLICENSED_HIGH_RISK
      - UNKNOWN_LOW_RISK
      title: ApkVerdict
    ApkVerifyRequest:
      properties:
        package_name:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.]+$
          title: Package Name
        signing_cert_sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          title: Signing Cert Sha256
        app_label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: App Label
        version_code:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Version Code
        installer_package:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Installer Package
          description: InstallSourceInfo; null = cài ngoài luồng
        requested_permissions:
          items:
            type: string
          type: array
          maxItems: 300
          title: Requested Permissions
      additionalProperties: false
      type: object
      required:
      - package_name
      - signing_cert_sha256
      title: ApkVerifyRequest
    ApkVerifyResponse:
      properties:
        audit_id:
          type: string
          format: uuid
          title: Audit Id
        apk_verdict:
          $ref: '#/components/schemas/ApkVerdict'
        severity:
