      security:
      - DeviceSignature: []
  /api/v1/policies/latest:
    get:
      tags:
      - edge-policy
      summary: Đồng bộ gói quy tắc ký số Ed25519 (ETag, < 40ms)
      operationId: policiesLatest
      security:
      - DeviceSignature: []
      - SandboxSession: []
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-None-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBundle'
        '304':
          description: Không đổi (ETag khớp)
        '401':
