      - DeviceSignature: []
  /api/v1/audits/contract-stream:
    post:
      tags:
      - audits
      summary: 'Trạm 2: soi 1–4 ảnh hợp đồng → SSE 5 pha (first event < 200ms, full < 3.5s)'
      operationId: auditsContractStream
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_auditsContractStream'
        required: true
      responses:
        '200':
          description: 'Luồng SSE: audit.sanitized → audit.vietqr_decoded → audit.fields_extracted → audit.verdict_computed
            → audit.legal_explained; ping mỗi 2.5s; audit.error (nếu có) luôn là event cuối. Schema: contracts/sse-events.schema.json.'
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                enum:
                - 'no'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-cache, no-transform
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-schema: contracts/sse-events.schema.json#/$defs/ContractAuditStream
        '401':
          description: Thiếu/sai xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload quá lớn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Định dạng không hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Vượt giới hạn tần suất / ngân sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi nội bộ (JSON, không bao giờ HTML — EC-OPS23)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - DeviceSignature: []
      - SandboxSession: []
