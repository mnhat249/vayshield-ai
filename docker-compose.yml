# VayShield AI — compose MỘT LỆNH cho Giám khảo kỹ thuật chạy mã nguồn .zip (File 6 §1.2 mục 7):
#     docker compose up --build        →   curl -s localhost:8000/healthz
# Build image linux/amd64 từ backend/Dockerfile (EC-OPS04). Mật khẩu dưới đây chỉ là mặc định
# DEMO LOCAL (giả); môi trường thật dùng infra/docker-compose.prod.yml + secret thật qua env.
# Dev hot-reload: infra/docker-compose.dev.yml.
#
# Hai role PostgreSQL (RLS không bị bypass — File 4 EC-DB15):
#   vayshield_admin : owner, CHỈ chạy migration (service db-init)
#   vayshield_app   : NOSUPERUSER NOBYPASSRLS, backend dùng role này
name: vayshield
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"   # EC-OPS13: vòng xoay log, không đầy ổ đĩa
    max-file: "3"

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vayshield
      POSTGRES_USER: vayshield_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-vayshield_admin_local_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayshield_admin -d vayshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Áp migration theo thứ tự tên file (LF bắt buộc — .gitattributes). Idempotent.
  db-init:
    image: pgvector/pgvector:pg16
    environment:
      ADMIN_URL: postgresql://vayshield_admin:${DB_ADMIN_PASSWORD:-vayshield_admin_local_secret}@postgres-pgvector:5432/vayshield
      APP_DB_PASSWORD: ${DB_PASSWORD:-vayshield_local_secret}
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$$ADMIN_URL" -v ON_ERROR_STOP=1 -v app_pw="$$APP_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE vayshield_app LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vayshield_app') \gexec
        ALTER ROLE vayshield_app LOGIN PASSWORD :'app_pw'
          NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
        GRANT CONNECT ON DATABASE vayshield TO vayshield_app;
        GRANT USAGE ON SCHEMA public TO vayshield_app;
        SQL
        for f in $$(ls /migrations/*.sql 2>/dev/null | sort); do
          echo "==> $$f"
          psql "$$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f "$$f"
        done
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    restart: "no"
    logging: *logging

  redis-hub:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  vayshield-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    image: vayshield-backend:local
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://vayshield_app:${DB_PASSWORD:-vayshield_local_secret}@postgres-pgvector:5432/vayshield
      REDIS_URL: redis://redis-hub:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SANDBOX_ENABLED: "true"
      SMS_PROVIDER: fake
      EMAIL_PROVIDER: fake
      # Khóa Gemini: để trống (chạy với mock/fake). Muốn gọi thật: export GEMINI_API_KEYS=... ở shell.
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    ports:
      - "8000:8000"   # CHỈ local; bản Cloud/prod chỉ lộ 443 (EC-OPS05)
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis-hub:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
