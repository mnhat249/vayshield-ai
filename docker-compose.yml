# Docker Compose DEV cho VayShield AI (T00). Bản prod-ready (Dockerfile, linux/amd64): T18.
# Chạy: docker compose up -d   →   curl -s localhost:8000/healthz
# Không cần Dockerfile: backend chạy bằng image uv chính thức, mount mã nguồn (hot reload).
services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vayshield
      POSTGRES_USER: vayshield_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vayshield_local_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mọi backend/migrations/*.sql chạy theo thứ tự tên file ở lần khởi tạo đầu tiên.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayshield_app -d vayshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-hub:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vayshield-backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    env_file:
      - path: .env.example
        required: false
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://vayshield_app:${DB_PASSWORD:-vayshield_local_secret}@postgres-pgvector:5432/vayshield
      REDIS_URL: redis://redis-hub:6379/0
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    command: >
      sh -c "uv sync --frozen &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers"
    volumes:
      - ./backend:/app
      - uv-cache:/root/.cache/uv
      - backend-venv:/opt/venv
    ports:
      - "8000:8000"
    depends_on:
      postgres-pgvector:
        condition: service_healthy
      redis-hub:
        condition: service_healthy

volumes:
  pgdata:
  uv-cache:
  backend-venv:
