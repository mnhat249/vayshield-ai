# VayShield AI — compose PRODUCTION cho VPS/Railway Pro tự quản (1 lệnh):
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/prod.env up -d --build
# infra/prod.env do NGƯỜI VẬN HÀNH tự tạo từ infra/env.sample (KHÔNG commit; .gitignore chặn .env*).
# Mọi secret dùng cú pháp ${VAR:?} → thiếu biến thì compose từ chối chạy, không có giá trị mặc định.
#
# Chỉ Caddy mở cổng 80/443 (EC-OPS05): REST + SSE + WSS cùng domain, TLS tự động. Postgres/Redis/backend
# KHÔNG publish cổng ra host. Backend chỉ tin X-Forwarded-For từ dải mạng nội bộ cố định bên dưới.
name: vayshield-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"   # EC-OPS13
    max-file: "3"

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24   # FORWARDED_ALLOW_IPS trỏ đúng dải này

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vayshield
      POSTGRES_USER: vayshield_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?đặt DB_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayshield_admin -d vayshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  db-init:
    image: pgvector/pgvector:pg16
    environment:
      ADMIN_URL: postgresql://vayshield_admin:${DB_ADMIN_PASSWORD:?đặt DB_ADMIN_PASSWORD}@postgres-pgvector:5432/vayshield
      APP_DB_PASSWORD: ${DB_PASSWORD:?đặt DB_PASSWORD}
    volumes:
      - ../backend/migrations:/migrations:ro
    networks: [edge]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$$ADMIN_URL" -v ON_ERROR_STOP=1 -v app_pw="$$APP_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE vayshield_app LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vayshield_app') \gexec
        ALTER ROLE vayshield_app LOGIN PASSWORD :'app_pw'
          NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
        GRANT CONNECT ON DATABASE vayshield TO vayshield_app;
        GRANT USAGE ON SCHEMA public TO vayshield_app;
        SQL
        for f in $$(ls /migrations/*.sql 2>/dev/null | sort); do
          echo "==> $$f"
          psql "$$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f "$$f"
        done
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    restart: "no"
    logging: *logging

  redis-hub:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [edge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  vayshield-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    platform: linux/amd64
    image: vayshield-backend:prod
    environment:
      APP_ENV: production
      APP_PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?đặt PUBLIC_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:?đặt CORS_ORIGINS (https://..., không dùng *)}
      DATABASE_URL: postgresql+asyncpg://vayshield_app:${DB_PASSWORD:?đặt DB_PASSWORD}@postgres-pgvector:5432/vayshield
      REDIS_URL: redis://redis-hub:6379/0
      PEPPER_B2B_PHONE: ${PEPPER_B2B_PHONE:?}
      PEPPER_MULE_ACCOUNT: ${PEPPER_MULE_ACCOUNT:?}
      KMS_MASTER_KEK: ${KMS_MASTER_KEK:?}
      ED25519_POLICY_PRIVATE_KEY: ${ED25519_POLICY_PRIVATE_KEY:?}
      JWT_OPS_SECRET: ${JWT_OPS_SECRET:?}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_VIP_KEYS: ${GEMINI_VIP_KEYS:-}
      SANDBOX_VIP_CODE: ${SANDBOX_VIP_CODE:-}
      EXPOSE_ERROR_DETAILS: "false"
      # Chỉ tin XFF từ proxy trong dải edge (Caddy). Thiếu dòng này → rate-limit IP gom về IP proxy.
      FORWARDED_ALLOW_IPS: 172.28.10.0/24
    expose:
      - "8000"
    networks: [edge]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis-hub:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?đặt PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - vayshield-backend
    restart: unless-stopped
    logging: *logging

  # EC-OPS11 / File 6 §1.2(1): ping /healthz mỗi 180 giây giữ ấm FastAPI→PG→Redis (không ngủ đông).
  keepwarm:
    image: python:3.12-slim-bookworm
    platform: linux/amd64
    environment:
      PROBE_URL: http://vayshield-backend:8000/healthz
      PROBE_INTERVAL_S: "180"
    volumes:
      - ./scripts/probe.py:/probe.py:ro
    command: ["python", "/probe.py", "--loop"]
    networks: [edge]
    depends_on:
      - vayshield-backend
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
